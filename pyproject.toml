[project]
name = "visionpipelines"
version = "0.1.0"
description = "Easy to use python module for advanced image processing tasks"
authors = [{ name = "Simone De Gasperis", email = "simone.de.gasperis94@gmail.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "kornia>=0.7.3",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.0.0",
    "opencv-python>=4.10.0.84",
    "matplotlib>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionpipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
